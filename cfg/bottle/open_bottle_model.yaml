task:
  task_name: "open_bottle"
  policy: "adaptive"
  num_episode: 20
  num_eval_episode: 10
  seed: 0
  max_step: 24

model:
  obs_horizon: 2
  action_horizon: 1
  pred_horizon: 4
  num_diffusion_iters: 100
  discrete: False
  input_feat: 3
  feat_dim: 128
  dof_dim: 0
  action_dim: 9 
  Transformer: False
  n_layer: 8
  n_cond_layers: 0
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: True
  time_as_cond: True
  pred_action_steps_only: False

  grasp: True # model grasp
  grasp_model_path: './ckpt/bottle/bottle_grasp.pth'
  diffusion_model_path:  './ckpt/bottle/bottle_manip.pth'

  collectData: False


env:
  env_name: "open bottle"
  numEnvs: 32
  numObservations: 26
  numActions: 9
  envSpacing: 2.0
  horizon: 50
  clockwise: 0.5
  actionSpeedScale: 20
  enableDebugVis: False

  enableCameraSensors: True
  enableForceSensors: False

  collectData: True
  collect_all: True
  collectPC: False
  collectForce: True
  visualizePointcloud: False
  PointDownSampleNum: 4096

  reset:
    bottle:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0
    franka:
      resetPositionNoise: 0.0
      resetRotationNoise: 0.0
      resetDofPosRandomInterval: 0.0
      resetDofVelRandomInterval: 0.0

  driveMode: "osc"
  clipObservations: 5.0
  clipActions: 1.0
  cam: 
    width: 512
    height: 512
    cam_far_plane: 2
    cam_near_plane: 0.01
    cam_horizontal_fov: 85
    cam_start:
      - [0, -0.3, 0.57]
      - [0, 0.3, 0.57]
    cam_target: 
      - [0, 0, 0.2]
      - [0, 0, 0.2]

  asset:
    assetRoot: "./assets"
    datasetPath: "bottle"
    AssetNum: 32
    randomAsset: False
    load_block: "test"
    limit_random: 0.5
    Assets:
      'test':
